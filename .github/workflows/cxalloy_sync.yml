name: CxAlloy Equipment Sync

on:
  schedule:
    # Runs daily at 19:00 UTC = 3:00 AM Malaysia Time (MYT, UTC+8, no DST).
    - cron: '0 19 * * *'
  workflow_dispatch: {}
    # ^ lets you trigger this manually from the "Actions" tab in GitHub,
    #   which is how you'll test it before trusting the schedule.

permissions:
  contents: write
  # ^ needed so the workflow can commit the updated CSV back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch CxAlloy equipment data and write CSV
        env:
          CXALLOY_IDENTIFIER: ${{ secrets.CXALLOY_IDENTIFIER }}
          CXALLOY_SECRET: ${{ secrets.CXALLOY_SECRET }}
          CXALLOY_PROJECT_ID: ${{ vars.CXALLOY_PROJECT_ID }}
        run: python cxalloy_to_csv.py

      - name: Fetch CxAlloy checklist data and write CSV
        env:
          CXALLOY_IDENTIFIER: ${{ secrets.CXALLOY_IDENTIFIER }}
          CXALLOY_SECRET: ${{ secrets.CXALLOY_SECRET }}
          CXALLOY_PROJECT_ID: ${{ vars.CXALLOY_PROJECT_ID }}
        run: python cxalloy_checklist_to_csv.py

      - name: Commit updated CSVs back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily CxAlloy equipment + checklist sync"
          file_pattern: 'data/equipment_status.csv data/checklist_status.csv'
