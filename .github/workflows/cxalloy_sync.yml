name: CxAlloy Equipment Sync

on:
  push:
    branches: [main]
    paths:
      - 'cxalloy_to_csv.py'
      - 'cxalloy_checklist_to_csv.py'
      - 'cxalloy_checklist_lines_to_csv.py'
      - 'build_equipment_checklist_snapshot.py'
      - 'build_checklist_daily_history.py'
      - '.github/workflows/cxalloy_sync.yml'
  schedule:
    # Daily at 18:00 UTC = 2:00 AM Malaysia Time (MYT, UTC+8).
    - cron: '0 18 * * *'
    # Weekly cutoff: Sunday 15:55 UTC = Sunday 11:55 PM Malaysia Time.
    - cron: '55 15 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch CxAlloy equipment data and write CSV
        env:
          CXALLOY_IDENTIFIER: ${{ secrets.CXALLOY_IDENTIFIER }}
          CXALLOY_SECRET: ${{ secrets.CXALLOY_SECRET }}
          CXALLOY_PROJECT_ID: ${{ vars.CXALLOY_PROJECT_ID }}
        run: python cxalloy_to_csv.py

      - name: Fetch CxAlloy checklist data and write CSV
        env:
          CXALLOY_IDENTIFIER: ${{ secrets.CXALLOY_IDENTIFIER }}
          CXALLOY_SECRET: ${{ secrets.CXALLOY_SECRET }}
          CXALLOY_PROJECT_ID: ${{ vars.CXALLOY_PROJECT_ID }}
        run: python cxalloy_checklist_to_csv.py

      - name: Fetch paginated checklist lines and update progress snapshots
        env:
          CXALLOY_IDENTIFIER: ${{ secrets.CXALLOY_IDENTIFIER }}
          CXALLOY_SECRET: ${{ secrets.CXALLOY_SECRET }}
          CXALLOY_PROJECT_ID: ${{ vars.CXALLOY_PROJECT_ID }}
        run: python cxalloy_checklist_lines_to_csv.py

      - name: Build per-equipment checklist completion snapshot
        run: python build_equipment_checklist_snapshot.py

      - name: Build compact daily checklist history
        run: python build_checklist_daily_history.py

      - name: Commit updated data back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily CxAlloy sync"
          file_pattern: 'data/equipment_status.csv data/checklist_status.csv data/checklist_progress_current.csv data/checklist_progress_daily.csv data/checklist_progress_history.csv data/checklist_completion_by_equipment.csv data/checklist_progress_daily_type.csv data/checklist_progress_equipment_changes.csv'
