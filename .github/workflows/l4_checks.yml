name: L4 tracker checks
on:
  pull_request:
    paths:
      - 'cxalloy_l4_sync.py'
      - 'test_l4_sync.py'
      - 'l4.js'
      - 'l4.css'
      - 'l4-pages.html'
      - 'index.html'
      - 'tests/l4_*'
      - '.github/workflows/l4_checks.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  l4-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check completion rules and extraction
        run: python -m unittest -q test_l4_sync.py
      - name: Check JavaScript syntax
        run: node --check l4.js
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium --only-shell
      - name: Check UI interactions and responsive layout
        run: |
          PYTHONPATH=. python tests/l4_fixture.py
          node tests/l4_ui.cjs
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-layout-check
          path: l4-*.png
          if-no-files-found: ignore
