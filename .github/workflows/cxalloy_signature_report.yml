name: CxAlloy Checklist Signature Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate checklist signature CSV
        env:
          CXALLOY_IDENTIFIER: ${{ secrets.CXALLOY_IDENTIFIER }}
          CXALLOY_SECRET: ${{ secrets.CXALLOY_SECRET }}
          CXALLOY_PROJECT_ID: '39282,51203'
        run: python cxalloy_checklist_signature_report.py

      - name: Upload checklist signature CSV
        uses: actions/upload-artifact@v4
        with:
          name: KUL21-checklist-signature-status
          path: checklist_signature_status.csv
          if-no-files-found: error
