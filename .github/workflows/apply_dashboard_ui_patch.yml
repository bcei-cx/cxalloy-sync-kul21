name: Apply Dashboard UI Patch

on:
  push:
    branches: [main]
    paths:
      - 'patch_all_dashboard_tables.py'
      - '.github/workflows/apply_dashboard_ui_patch.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply universal dashboard table tools
        run: python patch_all_dashboard_tables.py

      - name: Commit dashboard update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add dashboard-wide table search filters and sorting"
          file_pattern: 'index.html'
